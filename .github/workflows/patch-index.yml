name: Patch index.html

# Menjalankan semua patch idempoten di .github/scripts/ (urut nama file),
# lalu commit hasilnya ke index.html. Tambah patch baru cukup taruh .py di sana.

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-index.yml'
      - '.github/scripts/**.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: patch-index
  cancel-in-progress: false

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Jalankan patch
        run: |
          set -euo pipefail
          for f in .github/scripts/*.py; do
            echo "── $f"
            python3 "$f"
          done

      - name: Commit hasil
        run: |
          set -euo pipefail

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add index.html

          if git diff --cached --quiet; then
            echo "Tidak ada perubahan untuk di-commit."
            exit 0
          fi

          git commit -m "feat(index): lengkapi peran di baris Tier tabel Record [skip ci]"
          git push
